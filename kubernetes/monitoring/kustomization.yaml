apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-ingress.yaml
  - loki-datasource.yaml
  - prometheus-ingress.yaml
  - poc-app-alerts.yaml
  - poc-app-dashboard.yaml
configMapGenerator:
  - name: kubernetes-pods-dashboard
    files:
      - dashboards/kubernetes-pods.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: kubernetes-nodes-dashboard
    files:
      - dashboards/kubernetes-nodes.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: alertmanager-dashboard
    files:
      - dashboards/alertmanager.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: prometheus-dashboard
    files:
      - dashboards/prometheus.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
