replicaCount: 2
image:
  repository: poc-app
  pullPolicy: IfNotPresent
  tag: "1.0.0"
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
ingress:
  enabled: true
  className: nginx
  host: poc.local
  path: /
  pathType: Prefix
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 300m, memory: 256Mi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
config:
  APP_ENV: local
secret:
  API_KEY: change-me-local-only
serviceMonitor:
  enabled: true
  interval: 15s
alerting:
  enabled: true
  groupWait: 5s
  groupInterval: 30s
  repeatInterval: 4h
